<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace Licenses — ALIGNED</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="login" class="login hidden">
  <div class="login-brand">
    <img src="assets/aligned-logo-wordmark-on-dark.svg" alt="ALIGNED" width="180">
    <p>Google Workspace licenses, storage and income — across every tenant.</p>
  </div>
  <form id="login-form" class="login-form">
    <h1>Sign in</h1>
    <label>Username <input name="username" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Sign in</button>
    <p class="error" id="login-error" role="alert"></p>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top">
    <img src="assets/aligned-logo-wordmark-on-dark.svg" alt="ALIGNED" class="logo">
    <span class="product">Workspace Licenses</span>
    <span class="spacer"></span>
    <span class="sync-state" id="sync-state"></span>
    <button class="btn ghost-light hidden" id="sync-btn" type="button">Sync now</button>
    <span class="who" id="who"></span>
    <button class="btn ghost-light" id="logout" type="button">Sign out</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-view="overview" class="active">Overview</button>
    <button data-view="ask">Ask ✦</button>
    <button data-view="accounts">Accounts</button>
    <button data-view="changes">Created &amp; deleted</button>
    <button data-view="billing">Billing report</button>
    <button data-view="prices" data-cap="money">Prices</button>
    <button data-view="tenants" data-cap="tenants">Tenants</button>
    <button data-view="users" data-cap="users">Users</button>
  </nav>
  <main id="view"></main>
  <footer class="foot">ALIGNED · Read-only data from the Google Workspace Admin SDK</footer>
</div>

<script src="app.js"></script>
</body>
</html>
